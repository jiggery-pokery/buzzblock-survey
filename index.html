<style>
  :root{
    --bg:#E9EDEB;
    --surface:#FFFFFF;
    --surface-2:#F3F5F3;
    --border:#D5DBD8;
    --ink:#1E2A2A;
    --ink-soft:#5C6B69;
    --teal:#2B6E6B;
    --teal-dark:#1C4E4C;
    --teal-tint:#DEEBEA;
    --rust:#B5502F;
    --rust-tint:#F6E4DD;
    --amber:#C98A2C;
    --radius:12px;
    --display:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--surface-2);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }
  .header{
    position:sticky;
    top:0;
    z-index:20;
    background-color:var(--teal-dark);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 7px);
    color:#fff;
    padding:14px 18px 12px;
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{
    font-family:var(--display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.01em;
    text-transform:uppercase;
    line-height:1.05;
  }
  .brand small{display:block;font-family:var(--body);font-weight:400;text-transform:none;font-size:11px;color:rgba(255,255,255,0.75);letter-spacing:0;margin-top:3px;}
  .reset-btn{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    font-size:11px;
    font-family:var(--body);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  .steps{display:flex;gap:6px;margin-top:12px;}
  .step-pill{
    flex:1;
    text-align:center;
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:6px 2px;
    border-radius:8px;
    background:rgba(255,255,255,0.10);
    color:rgba(255,255,255,0.65);
    border:1px solid transparent;
  }
  .step-pill.active{background:rgba(255,255,255,0.95);color:var(--teal-dark);font-weight:700;}
  .step-pill.done{color:#fff;border-color:rgba(255,255,255,0.4);}

  .content{flex:1;padding:16px 16px 100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .section-title{
    font-family:var(--display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.01em;
    margin:0 0 4px;
    color:var(--ink);
  }
  .section-sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  label{
    display:block;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:5px;
    margin-top:14px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=date],input[type=email],input[type=number],select,textarea{
    width:100%;
    font-family:var(--body);
    font-size:15px;
    padding:11px 12px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:var(--surface-2);
    color:var(--ink);
    -webkit-appearance:none;
    appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%235C6B69'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%235C6B69' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:34px;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  textarea{resize:vertical;min-height:60px;font-family:var(--body);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .btn{
    font-family:var(--display);
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    border-radius:9px;
    padding:13px 18px;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-primary:disabled{background:#B7C4C2;cursor:not-allowed;}
  .btn-outline{background:transparent;color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);}
  .btn-danger{background:transparent;color:var(--rust);border:1.5px solid var(--rust);}
  .btn-sm{font-size:12px;padding:8px 12px;border-radius:8px;}
  .btn-block{width:100%;}

  .bottom-bar{
    position:sticky;bottom:0;left:0;right:0;
    background:linear-gradient(to top, var(--surface-2) 70%, rgba(243,245,243,0));
    padding:14px 16px 18px;
    display:flex;gap:10px;
  }
  .bottom-bar .btn{flex:1;}

  .room-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .room-top{display:flex;align-items:center;gap:12px;}
  .room-icon{
    width:42px;height:42px;border-radius:9px;background:var(--teal-tint);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0;
  }
  .room-main{flex:1;min-width:0;cursor:pointer;}
  .room-name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);}
  .room-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .room-meta.warn{color:var(--rust);}
  .room-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn.danger{color:var(--rust);border-color:var(--rust-tint);}
  .room-notes-input{margin-top:10px;min-height:44px;font-size:13px;padding:9px 10px;}

  .add-inline{display:flex;gap:8px;margin-top:4px;}
  .add-inline input{flex:1;}

  .window-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
  }
  .window-thumb{
    width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;display:block;
  }
  .window-thumb.placeholder{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .thumb-wrap{position:relative;flex-shrink:0;}
  .thumb-count{position:absolute;bottom:2px;right:2px;background:rgba(28,78,76,0.88);color:#fff;font-size:9px;font-weight:600;padding:1px 5px;border-radius:10px;}
  .window-main{flex:1;min-width:0;}
  .window-dims{font-family:var(--mono);font-weight:600;font-size:15px;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .tag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,0.2);}
  .window-notes{font-size:12px;color:var(--ink-soft);margin-top:6px;font-style:italic;}
  .window-price{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--teal-dark);margin-top:6px;}
  .window-price.warn{color:var(--rust);font-family:var(--body);font-weight:600;}
  .window-actions{display:flex;flex-direction:column;gap:6px;}

  .toggle-row{display:flex;gap:8px;margin-top:2px;}
  .toggle-btn{
    flex:1;padding:12px 6px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);
    font-family:var(--body);font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;text-align:center;
  }
  .toggle-btn.selected{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
  .colour-row{display:flex;gap:8px;margin-top:2px;}
  .colour-btn{
    flex:1;padding:12px 6px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--ink);
  }
  .colour-btn.selected{border-color:var(--teal);background:var(--teal-tint);}
  .colour-dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);}

  .photo-box{
    border:1.5px dashed var(--border);
    border-radius:9px;
    padding:14px;
    text-align:center;
    background:var(--surface-2);
  }
  .photo-thumb-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;}
  .photo-thumb-item{position:relative;flex-shrink:0;}
  .photo-thumb-item img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
  .photo-thumb-remove{
    position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--rust);color:#fff;
    font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface);
  }
  .photo-thumb-save{
    position:absolute;bottom:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;
    font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface);
  }
  .photo-placeholder{color:var(--ink-soft);font-size:13px;padding:10px 0 16px;}
  .photo-btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .field-error{color:var(--rust);font-size:12px;margin-top:6px;}

  .price-preview{
    background:var(--teal-tint);
    border:1px solid #BFDAD8;
    border-radius:9px;
    padding:10px 12px;
    margin-top:10px;
  }
  .price-preview.muted{background:var(--surface-2);border-color:var(--border);color:var(--ink-soft);font-size:13px;}
  .price-preview.warn{background:var(--rust-tint);border-color:#E8B9A4;color:var(--rust);font-size:13px;padding:10px 12px;border-radius:9px;margin-top:10px;}
  .price-preview-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .price-model{font-family:var(--display);font-weight:700;font-size:14px;color:var(--teal-dark);letter-spacing:0.01em;}
  .price-amount{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--teal-dark);}
  .price-preview-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .price-min-note{color:var(--amber);}

  .price-summary{
    background:var(--teal-dark);
    color:#fff;
    border-radius:var(--radius);
    padding:16px;
    margin-top:14px;
  }
  .price-summary-title{font-family:var(--display);font-weight:700;font-size:16px;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.03em;}
  .price-summary-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:rgba(255,255,255,0.85);}
  .price-summary-row.total{
    border-top:1px solid rgba(255,255,255,0.25);margin-top:6px;padding-top:10px;
    font-family:var(--display);font-weight:700;font-size:19px;color:#fff;letter-spacing:0.01em;
  }
  .price-summary-note{font-size:11px;color:rgba(255,255,255,0.65);margin-top:8px;line-height:1.4;}
  .promo-label{
    font-family:var(--display);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;
    color:rgba(255,255,255,0.7);margin:12px 0 5px;
  }
  .price-summary input[type=text]{
    background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);color:#fff;
  }
  .price-summary input[type=text]::placeholder{color:rgba(255,255,255,0.5);}
  .price-summary input[type=text]:focus{outline:2px solid rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.6);}

  .doc{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 16px;
  }
  .doc-title{font-family:var(--display);font-weight:700;font-size:22px;text-align:center;margin:0;}
  .doc-sub{text-align:center;font-size:12px;color:var(--ink-soft);margin:4px 0 16px;text-transform:uppercase;letter-spacing:0.06em;}
  .doc-hr{border:none;border-top:1.5px solid var(--teal);margin:10px 0 16px;}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:6px;}
  .doc-field-label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .doc-field-value{font-size:14px;font-weight:600;}
  .doc-block{margin-top:12px;}
  .doc-block .doc-field-value{font-weight:500;white-space:pre-wrap;}
  .doc-room-title{font-family:var(--display);font-weight:700;font-size:16px;margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .doc-room-notes{font-size:12px;color:var(--ink-soft);font-style:italic;margin-bottom:8px;}
  .doc-window-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);}
  .doc-window-row:last-child{border-bottom:none;}
  .doc-window-num{font-family:var(--mono);font-weight:600;color:var(--teal-dark);width:20px;flex-shrink:0;}
  .doc-window-thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);}
  .edit-link{font-size:12px;color:var(--teal-dark);text-decoration:underline;cursor:pointer;}

  .sign-terms{font-size:13px;line-height:1.5;color:var(--ink-soft);background:var(--surface-2);border-radius:9px;padding:12px;margin-bottom:14px;}
  canvas#sigPad{
    width:100%;height:180px;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:9px;
    touch-action:none;
    display:block;
  }
  .sig-caption{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:6px;}

  .empty-state{text-align:center;padding:30px 10px;color:var(--ink-soft);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,29,0.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-sheet{
    background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
    padding:20px 18px 24px;
  }
  .modal-title{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;}
  .modal-text{font-size:14px;color:var(--ink-soft);margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;}

  .done-check{
    width:64px;height:64px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;margin:10px auto 16px;font-size:30px;
  }
  .success-banner{background:var(--teal-tint);color:var(--teal-dark);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px;}

  @media (min-width:521px){
    body{padding:20px 0;}
    #app{border-radius:18px;overflow:hidden;min-height:auto;}
    .header{border-radius:18px 18px 0 0;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- Config ---------------- */
const COLOURS = { Brown:'#6B4A34', Black:'#1B1B1B', White:'#FFFFFF' };
const COLOUR_RGB = { Brown:[107,74,52], Black:[27,27,27], White:[255,255,255] };
const CONFIG_OPTIONS = [
  'Left to right (roller on left)',
  'Right to left (roller on right)',
  'Centre opening (roller on both sides)',
  'Top down (roller on top)',
  'Custom'
];

/* ---------------- Pricing ----------------
   Edit these constants if the supplier's rates or your labour policy change. */
const PRICING = {
  ratePetPerSqm: 265,          // S$ per m² — PET mesh (default)
  stainlessSurchargePerSqm: 30, // S$ per m² added on top, for Stainless Steel mesh
  labourFee: 300,               // S$ flat labour/trip fee for small jobs
  labourWaiveThreshold: 300     // labour fee is waived once the window subtotal reaches this (S$)
};
// Model max width (cm) and minimum chargeable area (m²), from the supplier price list.
const MODEL_TIERS = [
  { maxWidthCm: 75, minAreaSqm: 1.0, code: '835' },
  { maxWidthCm: 200, minAreaSqm: 1.2, code: '856' },
  { maxWidthCm: 500, minAreaSqm: 3.0, code: '876' }
];

function fmtSGD(n){
  if (n==null || isNaN(n)) return '—';
  return 'S$' + n.toLocaleString('en-SG', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// Derives the product model code, chargeable area and price for one window.
// Returns null fields (price:null) if width/height aren't filled in yet, or width exceeds every model's max.
function getModelInfo(w){
  const width = parseFloat(w.width), height = parseFloat(w.height);
  if (!width || !height || width<=0 || height<=0){
    return { model:null, rawArea:null, chargeableArea:null, minArea:null, ratePerSqm:null, price:null, exceedsMax:false };
  }
  const tier = MODEL_TIERS.find(t => width <= t.maxWidthCm);
  const ratePerSqm = PRICING.ratePetPerSqm + (w.netType==='Stainless Steel' ? PRICING.stainlessSurchargePerSqm : 0);
  if (!tier){
    return { model:null, rawArea:(width/100)*(height/100), chargeableArea:null, minArea:null, ratePerSqm, price:null, exceedsMax:true };
  }
  const model = tier.code;
  const rawArea = (width/100)*(height/100);
  const chargeableArea = Math.max(rawArea, tier.minAreaSqm);
  const price = chargeableArea * ratePerSqm;
  return { model, rawArea, chargeableArea, minArea:tier.minAreaSqm, ratePerSqm, price, exceedsMax:false };
}

// Sums pricing across every window in every room, and applies the labour fee rule.
function computeJobPricing(){
  let subtotal = 0, windowCount = 0, unpriced = 0;
  state.rooms.forEach(r => r.windows.forEach(w => {
    windowCount++;
    const info = getModelInfo(w);
    if (info.price!=null) subtotal += info.price; else unpriced++;
  }));
  const labourWaived = subtotal >= PRICING.labourWaiveThreshold;
  const labourFee = labourWaived ? 0 : PRICING.labourFee;
  const total = subtotal + labourFee;
  return { subtotal, labourFee, labourWaived, total, windowCount, unpriced };
}

// Promo codes are the format "discountXX" (e.g. discount20 = 20% off), capped at 25%.
const MAX_DISCOUNT_PERCENT = 25;
function getDiscountPercent(){
  const code = (state.promoCode||'').trim().toLowerCase();
  if (!code) return 0;
  const m = code.match(/^discount(\d{1,2})$/);
  if (!m) return 0;
  let pct = parseInt(m[1], 10);
  if (isNaN(pct) || pct<0) return 0;
  if (pct > MAX_DISCOUNT_PERCENT) pct = MAX_DISCOUNT_PERCENT;
  return pct;
}
// Full pricing including any promo code discount, applied over the subtotal+labour total.
function computeFinalPricing(){
  const p = computeJobPricing();
  const discountPercent = getDiscountPercent();
  const discountAmount = p.total * (discountPercent/100);
  const finalTotal = p.total - discountAmount;
  return Object.assign({}, p, { discountPercent, discountAmount, finalTotal });
}

function renderPriceSummaryTotals(){
  const fp = computeFinalPricing();
  const codeEntered = (state.promoCode||'').trim().length>0;
  const invalidCode = codeEntered && fp.discountPercent===0;
  return `
    ${fp.discountPercent>0 ? `<div class="price-summary-row"><span>Promo code (${fp.discountPercent}% off)</span><span>\u2212${fmtSGD(fp.discountAmount)}</span></div>` : ''}
    <div class="price-summary-row total"><span>Total</span><span>${fmtSGD(fp.finalTotal)}</span></div>
    ${invalidCode ? `<div class="price-summary-note" style="color:#F3C6B6;">Not a valid code — use the format discount20 (max ${MAX_DISCOUNT_PERCENT}%).</div>` : ''}
    <div class="price-summary-note">Rate: ${fmtSGD(PRICING.ratePetPerSqm)}/m² (PET), +${fmtSGD(PRICING.stainlessSurchargePerSqm)}/m² for Stainless Steel. Labour fee waived once window value reaches ${fmtSGD(PRICING.labourWaiveThreshold)}.</div>`;
}
function updatePriceSummaryTotals(){
  const el = document.getElementById('priceSummaryTotals');
  if (el) el.innerHTML = renderPriceSummaryTotals();
}

function renderPricePreview(d){
  const info = getModelInfo(d);
  if (info.exceedsMax){
    return `<div class="price-preview warn">Width exceeds our largest available size (max 500cm) — please double-check this measurement.</div>`;
  }
  if (info.price==null){
    return `<div class="price-preview muted">Enter width &amp; height to see the price.</div>`;
  }
  const minNote = info.rawArea < info.minArea
    ? ` <span class="price-min-note">(min ${info.minArea.toFixed(2)} m² applies)</span>` : '';
  return `
    <div class="price-preview">
      <div class="price-preview-row">
        <span class="price-model">Price</span>
        <span class="price-amount">${fmtSGD(info.price)}</span>
      </div>
      <div class="price-preview-sub">${info.chargeableArea.toFixed(2)} m²${minNote} × ${fmtSGD(info.ratePerSqm)}/m²</div>
    </div>`;
}
function updatePricePreview(){
  const el = document.getElementById('pricePreview');
  if (el) el.innerHTML = renderPricePreview(state.windowDraft);
}

/* ---------------- State ---------------- */
const state = {
  step: 'job', // job | rooms | room | window | review | done
  currentRoomId: null,
  editingWindowId: null,
  job: {
    customerName:'', addressLine1:'', addressLine2:'', postalCode:'', phone:'', email:'', notes:'',
    date: new Date().toISOString().slice(0,10),
    salesperson:''
  },
  rooms: [],
  windowDraft: null,
  newRoomName: '',
  signerName: '',
  promoCode: '',
  signOffDate: new Date().toISOString().slice(0,10),
  signatureData: null,
  signedAt: null,
  errors: {},
  modal: null // {title, text, confirmLabel, danger, onConfirm}
};
let idSeq = 1;
const newId = () => 'id' + (idSeq++);

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function addressLines(j){
  const lines = [];
  if (j.addressLine1) lines.push(j.addressLine1);
  if (j.addressLine2) lines.push(j.addressLine2);
  if (j.postalCode) lines.push('Postal Code: ' + j.postalCode);
  return lines;
}

function getRoom(id){ return state.rooms.find(r=>r.id===id); }

/* ---------------- Modal ---------------- */
function openModal(opts){ state.modal = opts; render(); }
function closeModal(){ state.modal = null; render(); }

/* ---------------- Navigation actions ---------------- */
function goStep(step){ state.step = step; render(); window.scrollTo(0,0); }

function continueFromJob(){
  const errs = {};
  if (!state.job.customerName.trim()) errs.customerName = "Enter the customer's name";
  state.errors = errs;
  if (Object.keys(errs).length) { render(); return; }
  goStep('rooms');
}

function addRoom(){
  const name = state.newRoomName.trim();
  if (!name) return;
  state.rooms.push({ id:newId(), name, notes:'', windows:[] });
  state.newRoomName = '';
  render();
}
function deleteRoom(id){
  const room = getRoom(id);
  openModal({
    title:'Delete room?',
    text:`This removes "${room.name}" and all ${room.windows.length} window entr${room.windows.length===1?'y':'ies'} in it.`,
    confirmLabel:'Delete room',
    danger:true,
    onConfirm:() => { state.rooms = state.rooms.filter(r=>r.id!==id); closeModal(); }
  });
}
function openRoom(id){ state.currentRoomId = id; goStep('room'); }

function totalWindows(){ return state.rooms.reduce((n,r)=>n+r.windows.length,0); }

/* ---------------- Window draft ---------------- */
function blankWindowDraft(){
  return { id:null, photos:[], width:'', height:'', netType:'PET', frameColour:'Brown', configuration:'', customConfiguration:'', notes:'' };
}
function addWindow(){
  state.windowDraft = blankWindowDraft();
  state.editingWindowId = null;
  state.errors = {};
  goStep('window');
}
function editWindow(winId){
  const room = getRoom(state.currentRoomId);
  const w = room.windows.find(x=>x.id===winId);
  state.windowDraft = Object.assign({}, w, { photos: (w.photos||[]).map(p=>Object.assign({},p)) });
  state.editingWindowId = winId;
  state.errors = {};
  goStep('window');
}
function deleteWindow(winId){
  const room = getRoom(state.currentRoomId);
  openModal({
    title:'Delete window?',
    text:'This measurement entry will be removed.',
    confirmLabel:'Delete window',
    danger:true,
    onConfirm:() => { room.windows = room.windows.filter(w=>w.id!==winId); closeModal(); }
  });
}
function setDraftField(field, value){ state.windowDraft[field] = value; }
function setNetType(v){ state.windowDraft.netType = v; render(); }
function setFrameColour(v){ state.windowDraft.frameColour = v; render(); }
function setConfiguration(v){
  state.windowDraft.configuration = v;
  if (v !== 'Custom') state.windowDraft.customConfiguration = '';
  render();
}

function compressImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb({ data: canvas.toDataURL('image/jpeg',0.72), ratio: canvas.width/canvas.height });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handlePhotoInput(fileInput){
  const files = Array.from(fileInput.files || []);
  files.forEach(file => {
    compressImageFile(file, photoObj => {
      state.windowDraft.photos.push(photoObj);
      render();
    });
  });
  fileInput.value = '';
}
function removePhotoAt(idx){ state.windowDraft.photos.splice(idx,1); render(); }

async function savePhotoToDevice(idx){
  const photo = state.windowDraft.photos[idx];
  if (!photo) return;
  try {
    const res = await fetch(photo.data);
    const blob = await res.blob();
    const file = new File([blob], `window-photo-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file] });
      return;
    }
    // Fallback for browsers without file sharing (e.g. desktop): trigger a normal download.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(err){
    if (err && err.name === 'AbortError') return; // user cancelled the share sheet
    console.warn('Save photo failed', err);
  }
}

function saveWindow(){
  const errs = {};
  const w = parseFloat(state.windowDraft.width);
  const h = parseFloat(state.windowDraft.height);
  if (!w || w<=0) errs.width = 'Enter width in cm';
  if (!h || h<=0) errs.height = 'Enter height in cm';
  state.errors = errs;
  if (Object.keys(errs).length){ render(); return; }

  const room = getRoom(state.currentRoomId);
  if (state.editingWindowId){
    const idx = room.windows.findIndex(x=>x.id===state.editingWindowId);
    room.windows[idx] = Object.assign({}, state.windowDraft, {id:state.editingWindowId, width:w, height:h});
  } else {
    room.windows.push(Object.assign({}, state.windowDraft, {id:newId(), width:w, height:h}));
  }
  state.windowDraft = null;
  goStep('room');
}

/* ---------------- Signature pad ---------------- */
let sigCtx=null, drawing=false, sigHasInk=false;
function initSigPad(){
  const canvas = document.getElementById('sigPad');
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*ratio;
  canvas.height = rect.height*ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#1E2A2A';
  sigHasInk = false;

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX-r.left, y: p.clientY-r.top };
  };
  const start = (e) => { e.preventDefault(); drawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); };
  const move = (e) => { if(!drawing) return; e.preventDefault(); const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasInk=true; };
  const end = (e) => { drawing=false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig(){
  const canvas = document.getElementById('sigPad');
  if (!canvas || !sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasInk = false;
  const err = document.getElementById('sigError');
  if (err) err.style.display='none';
}
function finalizeSign(){
  const nameInput = document.getElementById('signerNameInput');
  const dateInput = document.getElementById('signOffDateInput');
  state.signerName = nameInput.value.trim();
  state.signOffDate = dateInput.value || state.signOffDate;
  const errs = {};
  if (!state.signerName) errs.signerName = "Enter the signer's name";
  if (!sigHasInk) errs.signature = 'Please sign in the box above';
  state.errors = errs;
  if (Object.keys(errs).length){ render(); return; }
  const canvas = document.getElementById('sigPad');
  state.signatureData = canvas.toDataURL('image/png');
  state.signedAt = state.signOffDate;
  generateAllPDFs();
  goStep('done');
}

/* ---------------- PDF generation ---------------- */
function sanitizeFilename(s){ return String(s||'customer').trim().replace(/[^a-z0-9]+/gi,'_').slice(0,40); }

function generatePDF(internal){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 16, pageW = 210, pageH = 297, contentW = pageW - marginX*2, pageBottom = 273;
  let y = internal ? 46 : 40;

  function ensureSpace(h){
    if (y + h > pageBottom){ addFooterPlaceholder(); doc.addPage(); drawHeaderBand(false); y = 40; }
  }

  function drawHeaderBand(isFirst){
    doc.setFillColor(28,78,76);
    doc.rect(0,0,pageW, isFirst?34:16,'F');
    doc.setDrawColor(45,100,97); doc.setLineWidth(0.25);
    const bandH = isFirst?34:16;
    for (let i=-bandH; i<pageW+bandH; i+=7){ doc.line(i,0,i+bandH,bandH); }
    doc.setTextColor(255,255,255);
    if (isFirst){
      doc.setFont('helvetica','bold'); doc.setFontSize(20);
      doc.text('BuzzBlock', marginX, 15);
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      doc.text('Site Survey & Order Confirmation', marginX, 23);
      doc.setFontSize(8.5);
      doc.text(`Survey date: ${fmtDate(state.job.date)}`, pageW-marginX, 15, {align:'right'});
      if (state.job.salesperson) doc.text(`Sales rep: ${state.job.salesperson}`, pageW-marginX, 20, {align:'right'});
      if (internal){
        doc.setFillColor(181,80,47);
        doc.rect(0, 34, pageW, 6, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
        doc.text('INTERNAL COPY \u2014 FOR ORDERING & RECORDS ONLY \u2014 NOT FOR CUSTOMER', pageW/2, 38.2, {align:'center'});
      }
    } else {
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text('BuzzBlock — Site Survey (cont.)', marginX, 10.5);
    }
    doc.setTextColor(0,0,0);
  }

  function pillWidth(text){ doc.setFontSize(8.5); return doc.getTextWidth(text)+7; }
  function drawPill(x, yy, text, fillRGB, textRGB, dotRGB){
    doc.setFontSize(8.5);
    let extra = dotRGB ? 4 : 0;
    const w = doc.getTextWidth(text)+7+extra;
    doc.setFillColor(fillRGB[0],fillRGB[1],fillRGB[2]);
    doc.roundedRect(x, yy-3.6, w, 5.2, 2.6, 2.6, 'F');
    let tx = x+3.5;
    if (dotRGB){
      doc.setFillColor(dotRGB[0],dotRGB[1],dotRGB[2]);
      doc.setDrawColor(150,150,150); doc.setLineWidth(0.15);
      doc.circle(x+3.6, yy-0.9, 1.4, dotRGB[0]===255&&dotRGB[1]===255&&dotRGB[2]===255?'FD':'F');
      tx += 4.2;
    }
    doc.setTextColor(textRGB[0],textRGB[1],textRGB[2]);
    doc.text(text, tx, yy);
    doc.setTextColor(0,0,0);
    return x+w+3;
  }
  function addFooterPlaceholder(){ /* footer text added in final pass over all pages */ }

  drawHeaderBand(true);

  /* -------- Job info card -------- */
  const j = state.job;
  let addrLines = [];
  addressLines(j).forEach(part => { addrLines = addrLines.concat(doc.splitTextToSize(part, contentW-16)); });
  const notesLines = j.notes ? doc.splitTextToSize(j.notes, contentW-16) : [];
  const pairRows = [
    ['Customer', j.customerName || '-', 'Date', fmtDate(j.date)],
    ['Phone', j.phone || '-', 'Email', j.email || '-'],
    ['Sales rep', j.salesperson || '-', 'Total windows', String(totalWindows())]
  ];
  let boxH = 9 + pairRows.length*9.6;
  if (addrLines.length) boxH += 5 + addrLines.length*4.4;
  if (notesLines.length) boxH += 5 + notesLines.length*4.4;
  boxH += 5;

  doc.setFillColor(243,245,243);
  doc.setDrawColor(213,219,216); doc.setLineWidth(0.3);
  doc.roundedRect(marginX, y, contentW, boxH, 3, 3, 'FD');

  let iy = y+9;
  const colX2 = marginX + contentW/2;
  pairRows.forEach(([l1,v1,l2,v2])=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(7.3); doc.setTextColor(110,124,121);
    doc.text(l1.toUpperCase(), marginX+8, iy);
    doc.text(l2.toUpperCase(), colX2, iy);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(30,42,42);
    doc.text(String(v1), marginX+8, iy+4.6);
    doc.text(String(v2), colX2, iy+4.6);
    iy += 9.6;
  });
  if (addrLines.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(7.3); doc.setTextColor(110,124,121);
    doc.text('ADDRESS', marginX+8, iy);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,42,42);
    doc.text(addrLines, marginX+8, iy+4.4);
    iy += 5 + addrLines.length*4.4;
  }
  if (notesLines.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(7.3); doc.setTextColor(110,124,121);
    doc.text('GENERAL NOTES', marginX+8, iy);
    doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(70,80,78);
    doc.text(notesLines, marginX+8, iy+4.4);
    iy += 5 + notesLines.length*4.4;
  }
  doc.setTextColor(0,0,0);
  y += boxH + 8;

  /* -------- Rooms -------- */
  state.rooms.forEach((room, ri) => {
    ensureSpace(18);
    doc.setFillColor(43,110,107);
    doc.roundedRect(marginX, y, contentW, 8.5, 2, 2, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(`Room ${ri+1} \u2014 ${room.name}`, marginX+4.5, y+5.8);
    doc.setTextColor(0,0,0);
    y += 8.5 + 5;

    if (room.notes){
      const rn = doc.splitTextToSize(room.notes, contentW-4);
      ensureSpace(rn.length*4.2+4);
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(90,100,98);
      doc.text(rn, marginX+2, y);
      doc.setTextColor(0,0,0);
      y += rn.length*4.2 + 5;
    }

    if (!room.windows.length){
      ensureSpace(10);
      doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(140,140,140);
      doc.text('No windows recorded for this room.', marginX+2, y);
      doc.setTextColor(0,0,0);
      y += 10;
      return;
    }

    room.windows.forEach((w, wi) => {
      const photos = (w.photos||[]).slice(0,3);
      const notesLinesW = w.notes ? doc.splitTextToSize(w.notes, contentW-16) : [];
      const configLine = w.configuration ? (w.configuration==='Custom' ? (w.customConfiguration||'Custom configuration') : w.configuration) : '';
      const priceInfo = getModelInfo(w);

      const photoBoxSize = 48; // roughly a third of the content width
      const photoGap = 4;
      const extraPhotos = Math.max(0, (w.photos||[]).length - 3);
      const photoRowH = photoBoxSize + 6 + (extraPhotos>0 ? 5 : 0);
      let cardH = photoRowH + 8 /*size line*/ + 8 /*pills row*/ + 5.5 /*area/rate line*/;
      if (configLine) cardH += 5.2;
      if (notesLinesW.length) cardH += notesLinesW.length*4.2 + 3;
      cardH += 8;

      ensureSpace(cardH+4);

      doc.setFillColor(250,250,249);
      doc.setDrawColor(219,224,222); doc.setLineWidth(0.3);
      doc.roundedRect(marginX, y, contentW, cardH, 3, 3, 'FD');

      doc.setFillColor(43,110,107);
      doc.circle(marginX+10, y+10, 4.3, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text(String(wi+1), marginX+10, y+11.5, {align:'center'});
      doc.setTextColor(0,0,0);

      let px = marginX+18;
      const py = y+6;
      if (photos.length){
        photos.forEach(p => {
          let iw = photoBoxSize, ih = photoBoxSize;
          if (p.ratio){
            if (p.ratio>=1){ iw=photoBoxSize; ih=photoBoxSize/p.ratio; } else { ih=photoBoxSize; iw=photoBoxSize*p.ratio; }
          }
          const ox = px + (photoBoxSize-iw)/2, oy = py + (photoBoxSize-ih)/2;
          try { doc.addImage(p.data,'JPEG', ox, oy, iw, ih); } catch(e){}
          doc.setDrawColor(219,224,222); doc.setLineWidth(0.2);
          doc.rect(px, py, photoBoxSize, photoBoxSize);
          px += photoBoxSize + photoGap;
        });
        if (extraPhotos>0){
          doc.setFontSize(8); doc.setTextColor(140,140,140);
          doc.text(`+${extraPhotos} more photo${extraPhotos===1?'':'s'} on file`, marginX+8, py+photoBoxSize+5);
          doc.setTextColor(0,0,0);
        }
      } else {
        doc.setDrawColor(219,224,222); doc.setLineWidth(0.2);
        doc.rect(px, py, photoBoxSize, photoBoxSize);
        doc.setFontSize(8); doc.setTextColor(150,150,150);
        doc.text('No photo', px+4, py+photoBoxSize/2);
        doc.setTextColor(0,0,0);
      }

      let ty = y + photoRowH + 4;
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(`${w.width} \u00d7 ${w.height} cm`, marginX+8, ty);
      if (priceInfo.price!=null){
        doc.setFontSize(11);
        doc.setTextColor(28,78,76);
        doc.text(fmtSGD(priceInfo.price), marginX+contentW-8, ty, {align:'right'});
        doc.setTextColor(0,0,0);
      }
      ty += 6.2;

      let px2 = marginX+8;
      px2 = drawPill(px2, ty, w.netType, [222,235,234], [28,78,76]);
      px2 = drawPill(px2, ty, w.frameColour, [243,245,243], [30,42,42], COLOUR_RGB[w.frameColour]);
      ty += 1;

      ty += 5.5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(100,112,110);
      if (priceInfo.price!=null){
        const minNote = priceInfo.rawArea < priceInfo.minArea ? ` (min ${priceInfo.minArea.toFixed(2)} m\u00b2 applies)` : '';
        const modelPrefix = internal && priceInfo.model ? `Model ${priceInfo.model}  \u00b7  ` : '';
        doc.text(`${modelPrefix}${priceInfo.chargeableArea.toFixed(2)} m\u00b2${minNote}  \u00b7  ${fmtSGD(priceInfo.ratePerSqm)}/m\u00b2`, marginX+8, ty);
      } else if (priceInfo.exceedsMax){
        doc.setTextColor(181,80,47);
        doc.text('Exceeds our largest model\u2019s max width \u2014 price this window manually', marginX+8, ty);
      }
      doc.setTextColor(0,0,0);

      if (configLine){
        ty += 5.2;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,98);
        doc.text(`Opening: ${configLine}`, marginX+8, ty);
        doc.setTextColor(0,0,0);
      }
      if (notesLinesW.length){
        ty += (configLine?4.6:5.5);
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(90,100,98);
        doc.text(notesLinesW, marginX+8, ty);
        doc.setTextColor(0,0,0);
      }

      y += cardH + 5;
    });
    y += 2;
  });

  /* -------- Pricing summary -------- */
  const jobPricing = computeFinalPricing();
  const summaryRows = [
    [`Windows (${jobPricing.windowCount})`, fmtSGD(jobPricing.subtotal)],
    [`Labour fee${jobPricing.labourWaived ? ' (waived)' : ''}`, jobPricing.labourWaived ? 'S$0.00' : fmtSGD(jobPricing.labourFee)]
  ];
  if (jobPricing.discountPercent > 0){
    summaryRows.push([`Promo code (${jobPricing.discountPercent}% off)`, `-${fmtSGD(jobPricing.discountAmount)}`]);
  }
  const summaryNoteLines = doc.splitTextToSize(
    `Rate: ${fmtSGD(PRICING.ratePetPerSqm)}/m\u00b2 (PET), +${fmtSGD(PRICING.stainlessSurchargePerSqm)}/m\u00b2 for Stainless Steel. Labour fee waived once window value reaches ${fmtSGD(PRICING.labourWaiveThreshold)}.` +
    (jobPricing.unpriced>0 ? ` ${jobPricing.unpriced} window(s) exceed our largest available size and are excluded from this total \u2014 please price manually.` : ''),
    contentW-16
  );
  const summaryH = 12 + summaryRows.length*7 + 10 + summaryNoteLines.length*3.6 + 6;
  ensureSpace(summaryH+6);

  doc.setFillColor(28,78,76);
  doc.roundedRect(marginX, y, contentW, summaryH, 3, 3, 'F');
  let sy = y + 10;
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
  doc.text('Pricing Summary', marginX+8, sy);
  sy += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  summaryRows.forEach(([label,val])=>{
    doc.setTextColor(220,232,231);
    doc.text(label, marginX+8, sy);
    doc.text(val, marginX+contentW-8, sy, {align:'right'});
    sy += 7;
  });
  doc.setDrawColor(255,255,255); doc.setLineWidth(0.2);
  doc.line(marginX+8, sy-2.5, marginX+contentW-8, sy-2.5);
  sy += 3;
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.setTextColor(255,255,255);
  doc.text('Total', marginX+8, sy);
  doc.text(fmtSGD(jobPricing.finalTotal), marginX+contentW-8, sy, {align:'right'});
  sy += 6.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.setTextColor(190,208,206);
  doc.text(summaryNoteLines, marginX+8, sy);
  doc.setTextColor(0,0,0);
  y += summaryH + 8;

  /* -------- Customer confirmation -------- */
  ensureSpace(70);
  doc.setFillColor(43,110,107);
  doc.roundedRect(marginX, y, contentW, 8.5, 2, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
  doc.text('Customer Confirmation', marginX+4.5, y+5.8);
  doc.setTextColor(0,0,0);
  y += 8.5+7;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(50,60,58);
  const confirmText = `By signing below, ${state.signerName} confirms that the measurements, net type, frame colour, opening configuration and total price of ${fmtSGD(jobPricing.finalTotal)} listed above have been reviewed on-site and are approved for order.`;
  const confirmLines = doc.splitTextToSize(confirmText, contentW-4);
  doc.text(confirmLines, marginX+2, y);
  doc.setTextColor(0,0,0);
  y += confirmLines.length*5 + 8;

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Signed by:', marginX+2, y);
  doc.setFont('helvetica','normal'); doc.text(state.signerName, marginX+26, y);
  doc.setFont('helvetica','bold'); doc.text('Date:', marginX+contentW/2, y);
  doc.setFont('helvetica','normal'); doc.text(fmtDate(state.signOffDate), marginX+contentW/2+14, y);
  y += 9;

  if (state.signatureData){
    ensureSpace(38);
    doc.setDrawColor(219,224,222); doc.setLineWidth(0.3);
    doc.roundedRect(marginX+2, y, 70, 28, 2, 2, 'D');
    try { doc.addImage(state.signatureData, 'PNG', marginX+4, y+2, 66, 24); } catch(e){}
    y += 30;
  }
  doc.setDrawColor(150,150,150); doc.setLineWidth(0.2);
  doc.line(marginX+2, y, marginX+72, y);
  doc.setFontSize(8); doc.setTextColor(120,120,120);
  doc.text('Customer signature', marginX+2, y+4);
  doc.setTextColor(0,0,0);

  /* -------- Footer on every page -------- */
  const pageCount = doc.internal.getNumberOfPages();
  for (let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setDrawColor(225,228,226); doc.setLineWidth(0.25);
    doc.line(marginX, pageH-14, pageW-marginX, pageH-14);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,140,140);
    doc.text(internal ? 'BuzzBlock Site Survey App \u2014 Internal Copy' : 'Generated by BuzzBlock Site Survey App', marginX, pageH-9);
    doc.text(`Page ${p} of ${pageCount}`, pageW-marginX, pageH-9, {align:'right'});
    doc.setTextColor(0,0,0);
  }

  const filename = `${internal?'STAFF':'CUSTOMER'}_BuzzBlock_Survey_${sanitizeFilename(state.job.customerName)}_${state.job.date}.pdf`;
  doc.save(filename);
  return filename;
}

function generateAllPDFs(){
  const customerFile = generatePDF(false);
  const internalFile = generatePDF(true);
  state.lastPdfFilename = customerFile;
  state.lastPdfFilenameInternal = internalFile;
}

/* ---------------- Reset ---------------- */
function confirmReset(){
  openModal({
    title:'Start a new survey?',
    text:"This clears the current customer, rooms and windows. Make sure you've already saved the PDF if you need it.",
    confirmLabel:'Start new survey',
    danger:true,
    onConfirm:() => {
      state.step='job'; state.currentRoomId=null; state.editingWindowId=null;
      state.job={customerName:'',addressLine1:'',addressLine2:'',postalCode:'',phone:'',email:'',notes:'',date:new Date().toISOString().slice(0,10),salesperson:''};
      state.rooms=[]; state.windowDraft=null; state.newRoomName='';
      state.signerName=''; state.promoCode=''; state.signOffDate=new Date().toISOString().slice(0,10);
      state.signatureData=null; state.signedAt=null; state.errors={};
      closeModal();
    }
  });
}

/* ---------------- Render ---------------- */
function stepIndex(){
  return {job:0, rooms:1, room:1, window:1, review:2, done:2}[state.step];
}
function renderSteps(){
  const labels = ['Details','Rooms & Windows','Review & Sign-off'];
  const cur = stepIndex();
  return `<div class="steps">${labels.map((l,i)=>{
    const cls = i===cur ? 'active' : (i<cur ? 'done' : '');
    return `<div class="step-pill ${cls}">${i+1}. ${l}</div>`;
  }).join('')}</div>`;
}

function renderHeader(){
  const showReset = state.step !== 'job' || state.rooms.length>0;
  return `
  <div class="header">
    <div class="header-top">
      <div class="brand">BuzzBlock Site Survey<small>Field measurement &amp; sign-off</small></div>
      ${showReset ? `<button class="reset-btn" onclick="confirmReset()">New survey</button>` : ''}
    </div>
    ${renderSteps()}
  </div>`;
}

              <span class="tag"><span class="swatch" style="background:${COLOURS[w.frameColour]}"></span>${esc(w.frameColour)}</span>
              ${w.configuration ? `<span class="tag">${esc(w.configuration==='Custom' ? (w.customConfiguration||'Custom') : w.configuration)}</span>` : ''}
              ${w.photos && w.photos.length>1 ? `<span class="tag">${w.photos.length} photos</span>` : ''}
            </div>
            ${(() => { const info = getModelInfo(w); return info.price!=null
              ? `<div class="window-price">${info.chargeableArea.toFixed(2)} m² · ${fmtSGD(info.price)}</div>`
              : (info.exceedsMax ? `<div class="window-price warn">Exceeds max width — price not calculated</div>` : ''); })()}
            ${w.notes?`<div class="window-notes">${esc(w.notes)}</div>`:''}
          </div>
        </div>
      `).join('')}
    `).join('')}
  </div>

  ${(() => {
    const p = computeJobPricing();
    return `
    <div class="price-summary">
      <div class="price-summary-title">Pricing Summary</div>
      <div class="price-summary-row"><span>Windows (${p.windowCount})</span><span>${fmtSGD(p.subtotal)}</span></div>
      <div class="price-summary-row"><span>Labour fee${p.labourWaived?' (waived)':''}</span><span>${p.labourWaived?'S$0.00':fmtSGD(p.labourFee)}</span></div>
      ${p.unpriced>0 ? `<div class="price-summary-note">${p.unpriced} window(s) exceed our largest available size — please price these manually, they're excluded from the total above.</div>` : ''}

      <label class="promo-label">Promo code (optional)</label>
      <input type="text" id="promoCodeInput" value="${esc(state.promoCode)}" oninput="state.promoCode=this.value; updatePriceSummaryTotals();">

      <div id="priceSummaryTotals">${renderPriceSummaryTotals()}</div>
    </div>`;
  })()}

  <div class="card" style="margin-top:14px;">
    <div class="section-title">Customer sign-off</div>
    <div class="sign-terms">By signing, the customer confirms the measurements, net type, frame colour and opening configuration on the form are correct and approved for order.</div>

    <div class="row2">
      <div>
        <label>Signer's name</label>
        <input type="text" id="signerNameInput" value="${esc(state.signerName || state.job.customerName)}" placeholder="Full name">
        ${e.signerName?`<div class="field-error">${esc(e.signerName)}</div>`:''}
      </div>
      <div>
        <label>Sign-off date</label>
        <input type="date" id="signOffDateInput" value="${esc(state.signOffDate)}">
      </div>
    </div>

    <label>Signature</label>
    <canvas id="sigPad"></canvas>
    <div class="sig-caption">Sign with finger or stylus above</div>
    ${e.signature?`<div class="field-error" id="sigError">${esc(e.signature)}</div>`:'<div class="field-error" id="sigError" style="display:none;"></div>'}
    <div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" onclick="clearSig()">Clear signature</button></div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" onclick="goStep('rooms')">Back</button>
    <button class="btn btn-primary" onclick="finalizeSign()">Confirm &amp; save PDF</button>
  </div>`;
}

function renderDoneStep(){
  return `
  <div class="card" style="text-align:center;">
    <div class="done-check">✓</div>
    <div class="section-title">Signed &amp; saved</div>
    <div class="success-banner">Two PDFs were downloaded to this device:<br>
      <strong>${esc(state.lastPdfFilename || 'CUSTOMER_Survey.pdf')}</strong> (send to the customer)<br>
      <strong>${esc(state.lastPdfFilenameInternal || 'STAFF_Survey.pdf')}</strong> (keep for your records &amp; ordering)
    </div>
    <p class="section-sub" style="margin-top:0;">The internal copy includes the product model codes; the customer copy doesn't. Generate both again below if needed.</p>
    <button class="btn btn-outline btn-block" onclick="generateAllPDFs()">Download both PDFs again</button>
  </div>
  <div class="bottom-bar">
    <button class="btn btn-ghost" onclick="goStep('review')">View form</button>
    <button class="btn btn-primary" onclick="confirmReset()">Start next survey</button>
  </div>`;
}

function renderModal(){
  if (!state.modal) return '';
  const m = state.modal;
  return `
  <div class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">${esc(m.title)}</div>
      <div class="modal-text">${esc(m.text)}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn ${m.danger?'btn-danger':'btn-primary'}" id="modalConfirmBtn">${esc(m.confirmLabel)}</button>
      </div>
    </div>
  </div>`;
}

function render(){
  let content = '';
  switch(state.step){
    case 'job': content = renderJobStep(); break;
    case 'rooms': content = renderRoomsStep(); break;
    case 'room': content = renderRoomStep(); break;
    case 'window': content = renderWindowStep(); break;
    case 'review': content = renderReviewStep(); break;
    case 'done': content = renderDoneStep(); break;
  }
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="content">${content}</div>
    ${renderModal()}
  `;
  if (state.modal){
    const btn = document.getElementById('modalConfirmBtn');
    if (btn) btn.onclick = state.modal.onConfirm;
  }
  if (state.step === 'review'){
    setTimeout(initSigPad, 0);
  }
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
